name: Windows Desktop Core

on:
  push:
    branches: ["codex/windows-core", "codex/windows-review", "codex/windows-review-packaging", "windows"]
    paths: ["desktop/**", "internal/desktop/**", "cmd/desktop-agent/**", "go.mod", "go.sum", ".github/workflows/desktop.yml"]
  pull_request:
    branches: [windows]
    paths: ["desktop/**", "internal/desktop/**", "cmd/desktop-agent/**", "go.mod", "go.sum", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-desktop:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      # The repository's default package is intentionally unsigned. Setting
      # this repository variable to 1 enables the explicit certificate gate
      # and passes signExecutable=true as an explicit CLI override in CI.
      MOLE_REQUIRE_WINDOWS_SIGNING: ${{ vars.MOLE_REQUIRE_WINDOWS_SIGNING || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Test read-only Go packages
        run: go test -race ./internal/desktop ./cmd/desktop-agent
      - name: Test existing Windows Go tools
        run: go test ./cmd/analyze ./cmd/status
      - name: Check reachable desktop Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./internal/desktop ./cmd/desktop-agent
      - name: Install pinned desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Audit desktop dependency advisories
        working-directory: desktop
        run: npm audit --audit-level=high
      - name: Build native collector and renderer
        working-directory: desktop
        run: npm run build
      - name: Verify source runtime asset manifest
        working-directory: desktop
        run: npm run verify:integrity
      - name: Test IPC, native readings and controlled maintenance boundaries
        working-directory: desktop
        env:
          MOLE_NATIVE_WINDOWS: "1"
        run: npm test
      - name: Test actual Windows GUI
        working-directory: desktop
        run: npm run test:e2e
      - name: Package portable Windows app
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ vars.MOLE_REQUIRE_WINDOWS_SIGNING == '1' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MOLE_WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MOLE_WINDOWS_CSC_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ($env:MOLE_REQUIRE_WINDOWS_SIGNING -eq "1") {
            if ([string]::IsNullOrWhiteSpace($env:CSC_LINK) -or [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) {
              throw "MOLE_REQUIRE_WINDOWS_SIGNING=1 requires MOLE_WINDOWS_CSC_LINK and MOLE_WINDOWS_CSC_KEY_PASSWORD secrets."
            }
            npx electron-builder --config.win.signExecutable=true --config.forceCodeSigning=true --win portable --x64 --publish never
          } else {
            Write-Host "Building explicitly unsigned Windows release (signExecutable=false)."
            npx electron-builder --win portable --x64 --publish never
          }
      - name: Hash portable build
        working-directory: desktop
        shell: pwsh
        run: |
          if ($env:MOLE_REQUIRE_WINDOWS_SIGNING -eq "1") {
            Get-ChildItem release/Mole-Desktop-*.exe | ForEach-Object {
              $signature = Get-AuthenticodeSignature -FilePath $_.FullName
              if ($signature.Status -ne 'Valid') { throw "The signed release gate requires a valid Authenticode signature." }
            }
          }
          Get-ChildItem release/Mole-Desktop-*.exe | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
      - name: Test hardened packaged runtime and renderer-only pages
        working-directory: desktop
        env:
          MOLE_PACKAGED_EXE: release/win-unpacked/Mole Desktop.exe
          MOLE_PORTABLE_DIR: release
        run: npm run test:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: Mole-Desktop-Core-Windows-x64-${{ vars.MOLE_REQUIRE_WINDOWS_SIGNING == '1' && 'signed' || 'unsigned' }}
          path: |
            desktop/release/Mole-Desktop-*.exe
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-GUI-test-evidence
          path: desktop/test-results/
          if-no-files-found: ignore
